id = "chongchong59699.git-commit-template"
name = "Git Commit Template"
version = "1.3.0"
description = "Visual Conventional Commits form for the Git Commit toolbar, featuring a centered auto-closing dialog card, scope history, 72-char wrapping, and before-commit checks."
authors = ["chongchong59699"]
homepage = "https://github.com/chongchong59699/openidea-git-commit-template"
license = "MIT"
change-notes = "1.3.0 — Full multi-language localization (11 languages), centered auto-closing commit template form, lossless ! / Fixes round-tripping, and Conventional Commits check."
categories = ["vcs", "tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.16"
wasm = "dist/plugin.wasm"
activation = ["on-view:editor", "on-command:*"]

[capabilities]
required = ["vcs.read", "vcs.write", "storage", "ide.commands"]

[[contributes.commands]]
id = "open"
title = "Edit Commit Message (Git Commit Template)"
category = "Git Commit Template"

[[contributes.menus]]
menu = "commit.message"
command = "open"

[[contributes.menus]]
menu = "tools"
command = "open"

[[contributes.customEditors]]
id = "editor"
title = "Edit Commit Message"
patterns = ["*.git-commit-template"]
priority = "default"
layout = "tab"
web = "web/index.html"
binary = true

[[contributes.commitChecks]]
id = "conventional"
title = "Conventional Commits Format"

[[contributes.keymaps]]
command = "open"
key = "Ctrl+Alt+Shift+C"
mac = "Meta+Alt+Shift+C"
