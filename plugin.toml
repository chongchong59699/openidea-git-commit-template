id = "chongchong59699.git-commit-template"
name = "Git Commit Template"
version = "1.4.0"
description = "Visual Conventional Commits modal dialog for the Git Commit toolbar, with scope history, 72-char wrapping, 11 languages, and before-commit checks."
authors = ["chongchong59699"]
homepage = "https://github.com/chongchong59699/openidea-git-commit-template"
license = "MIT"
change-notes = "1.4.0 — Migrated to OpenIDEA v0.1.54 native modal dialogs ([[contributes.dialogs]], API 1.18): true resizable IDE dialog with Esc/OK/Cancel auto-close and zero high-risk capabilities (removed ide.commands)."
categories = ["vcs", "tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.18"
wasm = "dist/plugin.wasm"
activation = ["on-view:editor", "on-command:*"]

[capabilities]
required = ["vcs.read", "vcs.write", "storage"]

[[contributes.commands]]
id = "open"
title = "Edit Commit Message (Git Commit Template)"
category = "Git Commit Template"

[[contributes.menus]]
menu = "commit.message"
command = "open"

[[contributes.menus]]
menu = "tools"
command = "open"

[[contributes.dialogs]]
id = "editor"
title = "Edit Commit Message"
web = "web/index.html"
width = 780
height = 820

[[contributes.commitChecks]]
id = "conventional"
title = "Conventional Commits Format"

[[contributes.keymaps]]
command = "open"
key = "Ctrl+Alt+Shift+C"
mac = "Meta+Alt+Shift+C"
