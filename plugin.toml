id = "local.git-commit-template"
name = "Git Commit Template"
version = "1.1.0"
description = "挂载在 Git 提交面板工具栏的提交信息模板插件，支持原生弹窗快速向导、侧边高级编辑面板与 Conventional Commits 提交前规范检查。"
authors = ["Local Developer"]
license = "MIT"
change-notes = "1.1.0 — 新增原生弹窗快速填充向导（确认或按 Esc 自动关闭），优化侧边高级编辑面板交互与预览同步，新增 Conventional Commits 提交前检查，修复正文误识别为 Issues 及 ! / Fixes 丢失等问题。"
categories = ["vcs", "tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.3"
wasm = "dist/plugin.wasm"
activation = ["on-view:editor", "on-command:*"]

[capabilities]
required = ["vcs.read", "vcs.write", "storage"]

[[contributes.commands]]
id = "open"
title = "快速生成提交消息 (弹窗向导)"
category = "Git Commit Template"

[[contributes.commands]]
id = "open_panel"
title = "打开提交消息高级编辑面板"
category = "Git Commit Template"

[[contributes.menus]]
menu = "commit.message"
command = "open"

[[contributes.menus]]
menu = "tools"
command = "open_panel"

[[contributes.views]]
id = "editor"
title = "编辑提交消息"
icon = "icon.svg"
location = "right"

[[contributes.commitChecks]]
id = "conventional"
title = "Conventional Commits 规范检查"

[[contributes.keymaps]]
command = "open"
key = "Ctrl+Alt+Shift+C"
mac = "Meta+Alt+Shift+C"
