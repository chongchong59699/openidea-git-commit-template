id = "local.git-commit-template"
name = "Git Commit Template"
version = "1.2.0"
description = "挂载在 Git 提交面板工具栏的提交信息模板插件，在主区域弹出完整可视化大表单，填充后自动关闭，并内置 Conventional Commits 提交前规范检查。"
authors = ["Local Developer"]
license = "MIT"
change-notes = "1.2.0 — 改为在主区域居中打开完整卡片式大表单（经典单选列表布局），点击【好的】、【取消】或按 Esc 自动关闭表单页；保留常用范围记忆、72 字符自动换行、! / Fixes 解析修复与提交前检查。"
categories = ["vcs", "tools"]
icon = "icon.svg"
icon-dark = "icon_dark.svg"
engines.openidea = "^1.16"
wasm = "dist/plugin.wasm"
activation = ["on-view:editor", "on-command:*"]

[capabilities]
required = ["vcs.read", "vcs.write", "storage", "ide.commands"]

[[contributes.commands]]
id = "open"
title = "编辑提交消息 (Git Commit Template)"
category = "Git Commit Template"

[[contributes.menus]]
menu = "commit.message"
command = "open"

[[contributes.menus]]
menu = "tools"
command = "open"

[[contributes.customEditors]]
id = "editor"
title = "编辑提交消息"
patterns = ["*.git-commit-template"]
priority = "default"
layout = "tab"
web = "web/index.html"
binary = true

[[contributes.commitChecks]]
id = "conventional"
title = "Conventional Commits 规范检查"

[[contributes.keymaps]]
command = "open"
key = "Ctrl+Alt+Shift+C"
mac = "Meta+Alt+Shift+C"
