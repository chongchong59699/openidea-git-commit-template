<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑提交消息</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--openidea-bg-canvas, rgba(0, 0, 0, 0.18));
    color: var(--openidea-fg, #bcbec4);
    font-family: var(--openidea-font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif);
    font-size: var(--openidea-font-size, 13px);
    line-height: 1.45;
  }

  .backdrop {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    height: 100%;
    padding: 16px 20px;
    overflow: hidden;
  }

  .dialog-card {
    display: flex;
    flex-direction: column;
    width: min(740px, 100%);
    max-height: calc(100vh - 32px);
    background: var(--openidea-bg, #1e1f22);
    border: 1px solid var(--openidea-border, #3f4147);
    border-radius: 8px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.36);
    overflow: hidden;
  }

  .dialog-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--openidea-border, #393b40);
    user-select: none;
  }

  .dialog-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 4px;
    color: var(--openidea-fg-muted, #9da0a8);
    cursor: pointer;
    padding: 0;
    font-size: 16px;
    line-height: 1;
  }

  .icon-btn:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.08));
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .form-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 20px 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: 78px minmax(0, 1fr);
    column-gap: 14px;
    row-gap: 11px;
    align-items: start;
  }

  .row-label {
    color: var(--openidea-fg, #bcbec4);
    padding-top: 5px;
    user-select: none;
    white-space: nowrap;
  }

  .row-label.radio-label {
    padding-top: 2px;
    align-self: center;
  }

  .req-dot {
    color: var(--openidea-danger, #f75464);
    margin-left: 2px;
  }

  .radio-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .radio-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background-color 0.1s ease;
  }

  .radio-item:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.05));
  }

  .radio-item input[type="radio"] {
    margin: 3px 0 0 0;
    accent-color: var(--openidea-accent, #3574f0);
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    cursor: pointer;
  }

  .radio-text {
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .radio-code {
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    color: var(--openidea-accent, #548af7);
    margin-left: 4px;
  }

  .radio-desc {
    color: var(--openidea-fg-muted, #868a91);
  }

  input[type="text"],
  textarea,
  select {
    width: 100%;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }

  input[type="text"]:focus,
  textarea:focus,
  select:focus {
    border-color: var(--openidea-accent, #3574f0);
    box-shadow: 0 0 0 1px var(--openidea-focus-ring, rgba(53, 116, 240, 0.45));
  }

  input[type="text"].invalid {
    border-color: var(--openidea-danger, #f75464);
  }

  textarea {
    resize: vertical;
    min-height: 64px;
  }

  .textarea-compact {
    min-height: 48px;
  }

  .combo {
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .combo input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-right: none;
  }

  .combo-btn {
    width: 28px;
    flex: 0 0 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-muted, #9da0a8);
    border: 1px solid var(--openidea-border, #43454a);
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .combo-btn:hover {
    background: var(--openidea-bg-hover, #35373b);
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-menu {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    max-height: 180px;
    overflow-y: auto;
    background: var(--openidea-bg-elevated, #2b2d30);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    z-index: 20;
    display: none;
  }

  .combo-menu.open {
    display: block;
  }

  .combo-empty {
    padding: 8px 10px;
    color: var(--openidea-fg-muted, #868a91);
    font-size: 12px;
  }

  .combo-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-option:hover {
    background: var(--openidea-bg-selected, #2e436e);
  }

  .combo-del {
    background: transparent;
    border: none;
    color: var(--openidea-fg-muted, #868a91);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }

  .combo-del:hover {
    color: var(--openidea-danger, #f75464);
    background: rgba(255, 255, 255, 0.06);
  }

  .issues-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .issues-row select {
    width: 98px;
    flex: 0 0 98px;
    padding: 6px 6px;
  }

  .check-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .check-row input[type="checkbox"] {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--openidea-accent, #3574f0);
    cursor: pointer;
  }

  .sub-check {
    margin-top: 6px;
  }

  .field-hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--openidea-fg-muted, #868a91);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .count-warn {
    color: var(--openidea-warning, #e5a54b);
    font-weight: 500;
  }

  .preview-box {
    margin-top: 12px;
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    background: var(--openidea-bg-elevated, #25272a);
    overflow: hidden;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--openidea-fg-muted, #9da0a8);
    border-bottom: 1px solid var(--openidea-border, #393b40);
    user-select: none;
  }

  .preview-content {
    margin: 0;
    padding: 8px 10px;
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--openidea-fg-strong, #dfe1e5);
    max-height: 120px;
    overflow-y: auto;
  }

  .status-banner {
    display: none;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
  }

  .status-banner.show {
    display: block;
  }

  .status-banner.err {
    background: rgba(247, 84, 100, 0.14);
    color: var(--openidea-danger, #f75464);
    border: 1px solid rgba(247, 84, 100, 0.35);
  }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 20px;
    border-top: 1px solid var(--openidea-border, #393b40);
    background: var(--openidea-bg, #1e1f22);
  }

  .footer-left,
  .footer-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    min-width: 72px;
    height: 29px;
    padding: 0 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: 1px solid var(--openidea-border, #4e5157);
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    transition: background-color 0.1s ease, border-color 0.1s ease;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--openidea-bg-hover, #383a40);
  }

  .btn-primary {
    background: var(--openidea-accent, #3574f0);
    border-color: var(--openidea-accent, #3574f0);
    color: var(--openidea-fg-on-accent, #ffffff);
    font-weight: 500;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
    background: var(--openidea-accent, #3574f0);
  }

  .btn-ghost {
    min-width: auto;
    padding: 0 10px;
    border-color: transparent;
    background: transparent;
    color: var(--openidea-fg-muted, #9da0a8);
  }

  .btn-ghost:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.06));
    color: var(--openidea-fg-strong, #dfe1e5);
  }
</style>
</head>
<body>
<div class="backdrop">
  <div class="dialog-card" role="dialog" aria-labelledby="dialogTitle">
    <div class="dialog-header">
      <span class="dialog-title" id="dialogTitle">编辑提交消息</span>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="headerReloadBtn" title="重新读取当前提交框内容" aria-label="重新读取">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 2.5V5.5H10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="closeIconBtn" title="取消并关闭 (Esc)" aria-label="关闭">×</button>
      </div>
    </div>

    <div class="form-scroll">
      <div class="grid">
        <div class="row-label radio-label">提交类型</div>
        <div class="radio-list" id="typeList"></div>

        <label class="row-label" for="scopeInput">变更范围</label>
        <div class="combo" id="scopeCombo">
          <input id="scopeInput" type="text" placeholder="可选，如 auth、api、workflow" autocomplete="off" />
          <button type="button" class="combo-btn" id="scopeToggle" title="选择常用变更范围" aria-label="展开变更范围历史">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="combo-menu" id="scopeMenu"></div>
        </div>

        <label class="row-label" for="subjectInput">简短说明<span class="req-dot">*</span></label>
        <div>
          <input id="subjectInput" type="text" placeholder="必填：一句话概括本次变更" autocomplete="off" />
          <div class="field-hint">
            <span>按 Ctrl+Enter 确定填入 · 按 Esc 取消关闭</span>
            <span id="headerCount">0 字符</span>
          </div>
        </div>

        <label class="row-label" for="bodyInput">详细说明</label>
        <textarea id="bodyInput" placeholder="可选：详细描述改动背景、原因或实现要点"></textarea>

        <div></div>
        <label class="check-row">
          <input id="wrap72Input" type="checkbox" checked />
          <span>超过 72 字符换行?</span>
        </label>

        <label class="row-label" for="breakingInput">重大变化</label>
        <div>
          <textarea id="breakingInput" class="textarea-compact" placeholder="可选：描述不兼容变更（自动添加 BREAKING CHANGE: 前缀）"></textarea>
          <div class="sub-check">
            <label class="check-row">
              <input id="breakingBangInput" type="checkbox" />
              <span>标题附带 <code>!</code> 破坏性标记（如 <code>feat!:</code>）</span>
            </label>
          </div>
        </div>

        <label class="row-label" for="issuesInput">关闭 issues</label>
        <div class="issues-row">
          <select id="issueKeywordSelect" aria-label="Issue 关键字">
            <option value="Closes">Closes</option>
            <option value="Fixes">Fixes</option>
            <option value="Resolves">Resolves</option>
          </select>
          <input id="issuesInput" type="text" placeholder="可选：如 #123, #456（自动添加前缀）" autocomplete="off" />
        </div>

        <div></div>
        <label class="check-row">
          <input id="skipCiInput" type="checkbox" />
          <span>跳过 CI 流程?</span>
        </label>
      </div>

      <div class="preview-box">
        <div class="preview-header">
          <span>提交信息预览</span>
          <span id="previewMeta">1 行</span>
        </div>
        <pre class="preview-content" id="previewText"></pre>
      </div>

      <div class="status-banner" id="statusBanner"></div>
    </div>

    <div class="footer">
      <div class="footer-left">
        <button type="button" class="btn btn-ghost" id="reloadBtn" title="从当前 Commit 输入框重新读取">读取当前</button>
        <button type="button" class="btn btn-ghost" id="resetBtn" title="清空表单">重置</button>
      </div>
      <div class="footer-right">
        <button type="button" class="btn btn-primary" id="okBtn">好的</button>
        <button type="button" class="btn" id="cancelBtn">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const TYPES = [
    { id: "feat", title: "新功能、新特性", desc: "一个新功能" },
    { id: "fix", title: "修复 Bug", desc: "错误修复" },
    { id: "docs", title: "编辑文档", desc: "仅文档更改" },
    { id: "style", title: "代码格式修改", desc: "不影响代码含义的更改（例如：空格、格式、缺少分号）" },
    { id: "refactor", title: "代码重构", desc: "既不修复错误也不添加功能的代码更改" },
    { id: "perf", title: "代码优化", desc: "提高性能的代码更改" },
    { id: "test", title: "测试用例新增/修改", desc: "添加缺失的测试或纠正现有测试" },
    { id: "build", title: "修改项目构建/依赖", desc: "影响构建系统或外部依赖项的更改（例如：gulp、broccoli、npm）" },
    { id: "ci", title: "修改持续集成配置", desc: "对 CI 配置文件和脚本的更改（例如：Travis、Circle、BrowserStack、SauceLabs）" },
    { id: "chore", title: "其他修改", desc: "其他不修改 src 或测试文件的更改" },
    { id: "revert", title: "恢复上一次提交", desc: "恢复之前的提交" }
  ];

  const typeListEl = document.getElementById("typeList");
  const scopeInput = document.getElementById("scopeInput");
  const scopeToggle = document.getElementById("scopeToggle");
  const scopeMenu = document.getElementById("scopeMenu");
  const subjectInput = document.getElementById("subjectInput");
  const headerCount = document.getElementById("headerCount");
  const bodyInput = document.getElementById("bodyInput");
  const wrap72Input = document.getElementById("wrap72Input");
  const breakingBangInput = document.getElementById("breakingBangInput");
  const breakingInput = document.getElementById("breakingInput");
  const issueKeywordSelect = document.getElementById("issueKeywordSelect");
  const issuesInput = document.getElementById("issuesInput");
  const skipCiInput = document.getElementById("skipCiInput");
  const previewText = document.getElementById("previewText");
  const previewMeta = document.getElementById("previewMeta");
  const statusBanner = document.getElementById("statusBanner");
  const headerReloadBtn = document.getElementById("headerReloadBtn");
  const closeIconBtn = document.getElementById("closeIconBtn");
  const reloadBtn = document.getElementById("reloadBtn");
  const resetBtn = document.getElementById("resetBtn");
  const okBtn = document.getElementById("okBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  const hasBridge = Boolean(window.openidea && typeof window.openidea.postMessage === "function");

  let recentScopes = [];

  function renderTypeRadios() {
    typeListEl.innerHTML = "";
    for (const item of TYPES) {
      const label = document.createElement("label");
      label.className = "radio-item";
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "commitType";
      radio.value = item.id;
      radio.addEventListener("change", () => {
        clearStatus();
        requestPreview();
      });

      const textWrap = document.createElement("span");
      const titleSpan = document.createElement("span");
      titleSpan.className = "radio-text";
      titleSpan.textContent = item.title;

      const codeSpan = document.createElement("span");
      codeSpan.className = "radio-code";
      codeSpan.textContent = "(" + item.id + ")";

      const descSpan = document.createElement("span");
      descSpan.className = "radio-desc";
      descSpan.textContent = " - " + item.desc;

      textWrap.appendChild(titleSpan);
      textWrap.appendChild(codeSpan);
      textWrap.appendChild(descSpan);
      label.appendChild(radio);
      label.appendChild(textWrap);
      typeListEl.appendChild(label);
    }
  }

  function getSelectedType() {
    const checked = typeListEl.querySelector('input[name="commitType"]:checked');
    return checked ? checked.value : "feat";
  }

  function setSelectedType(type) {
    const target = typeListEl.querySelector('input[name="commitType"][value="' + type + '"]');
    if (target) {
      target.checked = true;
    } else {
      const first = typeListEl.querySelector('input[name="commitType"]');
      if (first) first.checked = true;
    }
  }

  function normalizeIssueKeyword(kw) {
    const lower = String(kw || "Closes").toLowerCase();
    if (lower.startsWith("fix")) return "Fixes";
    if (lower.startsWith("resolve")) return "Resolves";
    return "Closes";
  }

  function readForm() {
    return {
      commitType: getSelectedType(),
      scope: scopeInput.value,
      subject: subjectInput.value,
      body: bodyInput.value,
      wrap72: wrap72Input.checked,
      breakingBang: breakingBangInput.checked,
      breaking: breakingInput.value,
      issues: issuesInput.value,
      issueKeyword: issueKeywordSelect.value || "Closes",
      skipCi: skipCiInput.checked
    };
  }

  function populateForm(form) {
    if (!form) return;
    setSelectedType(form.commitType || "feat");
    scopeInput.value = form.scope || "";
    subjectInput.value = form.subject || "";
    subjectInput.classList.remove("invalid");
    bodyInput.value = form.body || "";
    wrap72Input.checked = form.wrap72 !== false;
    breakingBangInput.checked = Boolean(form.breakingBang);
    breakingInput.value = form.breaking || "";
    issueKeywordSelect.value = normalizeIssueKeyword(form.issueKeyword);
    issuesInput.value = form.issues || "";
    skipCiInput.checked = Boolean(form.skipCi);
  }

  function renderPreview(preview) {
    if (!preview || typeof preview !== "object") return;
    const msg = preview.message || "";
    const headerLen = typeof preview.headerLen === "number"
      ? preview.headerLen
      : Array.from((msg.split("\n")[0] || "")).length;
    const lineCount = typeof preview.lineCount === "number"
      ? preview.lineCount
      : msg.split("\n").length;

    previewText.textContent = msg;
    previewMeta.textContent = lineCount + " 行";
    if (preview.headerWarn || headerLen > 72) {
      headerCount.textContent = headerLen + " 字符 · 建议精简至 72 内";
      headerCount.className = "count-warn";
    } else {
      headerCount.textContent = headerLen + " 字符";
      headerCount.className = "";
    }
  }

  function requestPreview() {
    const form = readForm();
    if (hasBridge) {
      send({ op: "preview", form });
    } else {
      const bang = form.breakingBang ? "!" : "";
      const s = form.scope.trim();
      const header = (s ? `${form.commitType}(${s})${bang}: ` : `${form.commitType}${bang}: `) + form.subject.trim();
      renderPreview({
        message: header,
        headerLen: Array.from(header).length,
        headerWarn: Array.from(header).length > 72,
        lineCount: 1
      });
    }
  }

  function showError(text) {
    statusBanner.textContent = text;
    statusBanner.className = "status-banner show err";
  }

  function clearStatus() {
    statusBanner.className = "status-banner";
    statusBanner.textContent = "";
  }

  function renderScopeMenu() {
    scopeMenu.innerHTML = "";
    if (!recentScopes || recentScopes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = "暂无常用变更范围，直接输入即可自动记忆";
      scopeMenu.appendChild(empty);
      return;
    }
    for (const sc of recentScopes) {
      const row = document.createElement("div");
      row.className = "combo-option";
      const name = document.createElement("span");
      name.textContent = sc;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "combo-del";
      del.textContent = "×";
      del.title = "移除此记录";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        send({ op: "remove-scope", scope: sc });
      });
      row.addEventListener("click", () => {
        scopeInput.value = sc;
        scopeMenu.classList.remove("open");
        requestPreview();
        subjectInput.focus();
      });
      row.appendChild(name);
      row.appendChild(del);
      scopeMenu.appendChild(row);
    }
  }

  function send(payload) {
    if (hasBridge) {
      window.openidea.postMessage(JSON.stringify(payload));
    }
  }

  function submitForm() {
    clearStatus();
    const form = readForm();
    if (!form.subject.trim()) {
      subjectInput.classList.add("invalid");
      subjectInput.focus();
      showError("请填写简短说明（提交标题不能为空）。");
      return;
    }
    subjectInput.classList.remove("invalid");
    send({ op: "apply", form });
  }

  function cancelDialog() {
    clearStatus();
    send({ op: "cancel" });
  }

  scopeToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    scopeMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("scopeCombo").contains(e.target)) {
      scopeMenu.classList.remove("open");
    }
  });

  for (const el of [scopeInput, subjectInput, bodyInput, breakingInput, issuesInput]) {
    el.addEventListener("input", () => {
      if (el === subjectInput && subjectInput.value.trim()) {
        subjectInput.classList.remove("invalid");
      }
      clearStatus();
      requestPreview();
    });
  }

  for (const el of [wrap72Input, breakingBangInput, issueKeywordSelect, skipCiInput]) {
    el.addEventListener("change", () => {
      clearStatus();
      requestPreview();
    });
  }

  okBtn.addEventListener("click", submitForm);
  cancelBtn.addEventListener("click", cancelDialog);
  closeIconBtn.addEventListener("click", cancelDialog);

  function triggerReload() {
    clearStatus();
    send({ op: "reload" });
  }

  reloadBtn.addEventListener("click", triggerReload);
  headerReloadBtn.addEventListener("click", triggerReload);

  resetBtn.addEventListener("click", () => {
    clearStatus();
    populateForm({
      commitType: "feat",
      scope: "",
      subject: "",
      body: "",
      wrap72: true,
      breakingBang: false,
      breaking: "",
      issues: "",
      issueKeyword: "Closes",
      skipCi: false
    });
    requestPreview();
    subjectInput.focus();
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitForm();
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      e.stopPropagation();
      if (scopeMenu.classList.contains("open")) {
        scopeMenu.classList.remove("open");
      } else {
        cancelDialog();
      }
    }
  });

  renderTypeRadios();
  renderScopeMenu();
  populateForm({});
  requestPreview();

  if (window.openidea && typeof window.openidea.onMessage === "function") {
    window.openidea.onMessage((raw) => {
      let msg;
      try {
        msg = typeof raw === "string" ? JSON.parse(raw) : raw;
      } catch {
        return;
      }
      if (!msg || typeof msg !== "object") return;
      if (msg.op === "init") {
        clearStatus();
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        if (msg.form) {
          populateForm(msg.form);
        }
        if (msg.preview) {
          renderPreview(msg.preview);
        } else {
          requestPreview();
        }
        subjectInput.focus();
      } else if (msg.op === "preview") {
        renderPreview(msg.preview);
      } else if (msg.op === "scopes") {
        recentScopes = Array.isArray(msg.scopes) ? msg.scopes : [];
        renderScopeMenu();
      } else if (msg.op === "error") {
        showError(msg.message || "操作失败，请确认当前项目已打开 Git 仓库。");
      }
    });
  }

  send({ op: "ready" });
})();
</script>
</body>
</html>
