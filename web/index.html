<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Edit Commit Message</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--openidea-bg, #1e1f22);
    color: var(--openidea-fg, #bcbec4);
    font-family: var(--openidea-font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif);
    font-size: var(--openidea-font-size, 13px);
    line-height: 1.45;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
    background: var(--openidea-bg, #1e1f22);
  }

  .form-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 20px 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(84px, max-content) minmax(0, 1fr);
    column-gap: 14px;
    row-gap: 11px;
    align-items: start;
  }

  .row-label {
    color: var(--openidea-fg, #bcbec4);
    padding-top: 5px;
    user-select: none;
    white-space: nowrap;
  }

  .row-label.radio-label {
    padding-top: 2px;
    align-self: center;
  }

  .req-dot {
    color: var(--openidea-danger, #f75464);
    margin-left: 2px;
  }

  .radio-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .radio-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background-color 0.1s ease;
  }

  .radio-item:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.05));
  }

  .radio-item input[type="radio"] {
    margin: 3px 0 0 0;
    accent-color: var(--openidea-accent, #3574f0);
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    cursor: pointer;
  }

  .radio-text {
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .radio-code {
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    color: var(--openidea-accent, #548af7);
    margin-left: 4px;
  }

  .radio-desc {
    color: var(--openidea-fg-muted, #868a91);
  }

  input[type="text"],
  textarea,
  select {
    width: 100%;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }

  input[type="text"]:focus,
  textarea:focus,
  select:focus {
    border-color: var(--openidea-accent, #3574f0);
    box-shadow: 0 0 0 1px var(--openidea-focus-ring, rgba(53, 116, 240, 0.45));
  }

  input[type="text"].invalid {
    border-color: var(--openidea-danger, #f75464);
  }

  textarea {
    resize: vertical;
    min-height: 60px;
  }

  .textarea-compact {
    min-height: 46px;
  }

  .combo {
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .combo input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-right: none;
  }

  .combo-btn {
    width: 28px;
    flex: 0 0 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-muted, #9da0a8);
    border: 1px solid var(--openidea-border, #43454a);
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .combo-btn:hover {
    background: var(--openidea-bg-hover, #35373b);
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-menu {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    max-height: 180px;
    overflow-y: auto;
    background: var(--openidea-bg-elevated, #2b2d30);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    z-index: 20;
    display: none;
  }

  .combo-menu.open {
    display: block;
  }

  .combo-empty {
    padding: 8px 10px;
    color: var(--openidea-fg-muted, #868a91);
    font-size: 12px;
  }

  .combo-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-option:hover {
    background: var(--openidea-bg-selected, #2e436e);
  }

  .combo-del {
    background: transparent;
    border: none;
    color: var(--openidea-fg-muted, #868a91);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }

  .combo-del:hover {
    color: var(--openidea-danger, #f75464);
    background: rgba(255, 255, 255, 0.06);
  }

  .issues-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .issues-row select {
    width: 98px;
    flex: 0 0 98px;
    padding: 6px 6px;
  }

  .check-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .check-row input[type="checkbox"] {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--openidea-accent, #3574f0);
    cursor: pointer;
  }

  .sub-check {
    margin-top: 6px;
  }

  .field-hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--openidea-fg-muted, #868a91);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .count-warn {
    color: var(--openidea-warning, #e5a54b);
    font-weight: 500;
  }

  .preview-box {
    margin-top: 12px;
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    background: var(--openidea-bg-elevated, #25272a);
    overflow: hidden;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--openidea-fg-muted, #9da0a8);
    border-bottom: 1px solid var(--openidea-border, #393b40);
    user-select: none;
  }

  .preview-content {
    margin: 0;
    padding: 8px 10px;
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--openidea-fg-strong, #dfe1e5);
    max-height: 120px;
    overflow-y: auto;
  }

  .status-banner {
    display: none;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
  }

  .status-banner.show {
    display: block;
  }

  .status-banner.err {
    background: rgba(247, 84, 100, 0.14);
    color: var(--openidea-danger, #f75464);
    border: 1px solid rgba(247, 84, 100, 0.35);
  }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 20px;
    border-top: 1px solid var(--openidea-border, #393b40);
    background: var(--openidea-bg, #1e1f22);
  }

  .footer-left,
  .footer-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    min-width: 74px;
    height: 29px;
    padding: 0 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: 1px solid var(--openidea-border, #4e5157);
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    transition: background-color 0.1s ease, border-color 0.1s ease;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--openidea-bg-hover, #383a40);
  }

  .btn-primary {
    background: var(--openidea-accent, #3574f0);
    border-color: var(--openidea-accent, #3574f0);
    color: var(--openidea-fg-on-accent, #ffffff);
    font-weight: 500;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
    background: var(--openidea-accent, #3574f0);
  }

  .btn-ghost {
    min-width: auto;
    padding: 0 10px;
    border-color: transparent;
    background: transparent;
    color: var(--openidea-fg-muted, #9da0a8);
  }

  .btn-ghost:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.06));
    color: var(--openidea-fg-strong, #dfe1e5);
  }
</style>
</head>
<body>
<div class="app">
  <div class="form-scroll">
      <div class="grid">
        <div class="row-label radio-label" id="lblType">Commit Type</div>
        <div class="radio-list" id="typeList"></div>

        <label class="row-label" for="scopeInput" id="lblScope">Scope</label>
        <div class="combo" id="scopeCombo">
          <input id="scopeInput" type="text" placeholder="Optional, e.g. auth, api, workflow" autocomplete="off" />
          <button type="button" class="combo-btn" id="scopeToggle" title="Recent scopes" aria-label="Recent scopes">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="combo-menu" id="scopeMenu"></div>
        </div>

        <label class="row-label" for="subjectInput"><span id="lblSubject">Subject</span><span class="req-dot">*</span></label>
        <div>
          <input id="subjectInput" type="text" placeholder="Required: short imperative summary of the change" autocomplete="off" />
          <div class="field-hint">
            <span id="hintShortcut">Press Ctrl+Enter to apply · Esc to cancel</span>
            <span id="headerCount">0 chars</span>
          </div>
        </div>

        <label class="row-label" for="bodyInput" id="lblBody">Body</label>
        <textarea id="bodyInput" placeholder="Optional: motivation, context, or implementation details"></textarea>

        <div></div>
        <label class="check-row">
          <input id="wrap72Input" type="checkbox" checked />
          <span id="lblWrap72">Wrap lines at 72 characters?</span>
        </label>

        <label class="row-label" for="breakingInput" id="lblBreaking">Breaking</label>
        <div>
          <textarea id="breakingInput" class="textarea-compact" placeholder="Optional: describe breaking changes (auto-prefixed with BREAKING CHANGE:)"></textarea>
          <div class="sub-check">
            <label class="check-row">
              <input id="breakingBangInput" type="checkbox" />
              <span id="lblBreakingBang">Add <code>!</code> marker to header (e.g. <code>feat!:</code>)</span>
            </label>
          </div>
        </div>

        <label class="row-label" for="issuesInput" id="lblIssues">Close Issues</label>
        <div class="issues-row">
          <select id="issueKeywordSelect" aria-label="Issue keyword">
            <option value="Closes">Closes</option>
            <option value="Fixes">Fixes</option>
            <option value="Resolves">Resolves</option>
          </select>
          <input id="issuesInput" type="text" placeholder="Optional: e.g. #123, #456" autocomplete="off" />
        </div>

        <div></div>
        <label class="check-row">
          <input id="skipCiInput" type="checkbox" />
          <span id="lblSkipCi">Skip CI pipeline?</span>
        </label>
      </div>

      <div class="preview-box">
        <div class="preview-header">
          <span id="lblPreview">Commit Message Preview</span>
          <span id="previewMeta">1 line</span>
        </div>
        <pre class="preview-content" id="previewText"></pre>
      </div>

      <div class="status-banner" id="statusBanner"></div>
    </div>

    <div class="footer">
      <div class="footer-left">
        <button type="button" class="btn btn-ghost" id="reloadBtn">Reload</button>
        <button type="button" class="btn btn-ghost" id="resetBtn">Reset</button>
      </div>
      <div class="footer-right">
        <button type="button" class="btn btn-primary" id="okBtn">OK</button>
        <button type="button" class="btn" id="cancelBtn">Cancel</button>
      </div>
    </div>
</div>

  function resolveLocaleKey(tag) {
    const raw = String(tag || "").trim().toLowerCase();
    if (!raw) return "en";
    if (raw.startsWith("zh-tw") || raw.startsWith("zh-hk") || raw.startsWith("zh-mo") || raw.includes("hant")) return "zh-TW";
    if (raw.startsWith("zh")) return "zh-CN";
    if (raw.startsWith("ja")) return "ja";
    if (raw.startsWith("ko")) return "ko";
    if (raw.startsWith("fr")) return "fr";
    if (raw.startsWith("es")) return "es";
    if (raw.startsWith("pt")) return "pt";
    if (raw.startsWith("pl")) return "pl";
    if (raw.startsWith("tr")) return "tr";
    if (raw.startsWith("ru")) return "ru";
    return "en";
  }

  const params = new URLSearchParams(window.location.search);
  let currentLocaleKey = resolveLocaleKey(params.get("lang") || navigator.language || "en");

  function dict() {
    return I18N[currentLocaleKey] || I18N["en"];
  }

  const lblTypeEl = document.getElementById("lblType");
  const lblScopeEl = document.getElementById("lblScope");
  const lblSubjectEl = document.getElementById("lblSubject");
  const lblBodyEl = document.getElementById("lblBody");
  const lblWrap72El = document.getElementById("lblWrap72");
  const lblBreakingEl = document.getElementById("lblBreaking");
  const lblBreakingBangEl = document.getElementById("lblBreakingBang");
  const lblIssuesEl = document.getElementById("lblIssues");
  const lblSkipCiEl = document.getElementById("lblSkipCi");
  const lblPreviewEl = document.getElementById("lblPreview");
  const hintShortcutEl = document.getElementById("hintShortcut");

  const typeListEl = document.getElementById("typeList");
  const scopeInput = document.getElementById("scopeInput");
  const scopeToggle = document.getElementById("scopeToggle");
  const scopeMenu = document.getElementById("scopeMenu");
  const subjectInput = document.getElementById("subjectInput");
  const headerCount = document.getElementById("headerCount");
  const bodyInput = document.getElementById("bodyInput");
  const wrap72Input = document.getElementById("wrap72Input");
  const breakingBangInput = document.getElementById("breakingBangInput");
  const breakingInput = document.getElementById("breakingInput");
  const issueKeywordSelect = document.getElementById("issueKeywordSelect");
  const issuesInput = document.getElementById("issuesInput");
  const skipCiInput = document.getElementById("skipCiInput");
  const previewText = document.getElementById("previewText");
  const previewMeta = document.getElementById("previewMeta");
  const statusBanner = document.getElementById("statusBanner");
  const reloadBtn = document.getElementById("reloadBtn");
  const resetBtn = document.getElementById("resetBtn");
  const okBtn = document.getElementById("okBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  const hasBridge = Boolean(window.openidea && typeof window.openidea.postMessage === "function");

  let recentScopes = [];
  let lastPreviewState = { message: "feat: ", headerLen: 6, headerWarn: false, lineCount: 1 };

  function renderTypeRadios(selected) {
    const d = dict();
    const current = selected || getSelectedType();
    typeListEl.innerHTML = "";
    for (const id of TYPE_IDS) {
      const [title, desc] = d.types[id] || I18N["en"].types[id];
      const label = document.createElement("label");
      label.className = "radio-item";
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "commitType";
      radio.value = id;
      radio.checked = id === current;
      radio.addEventListener("change", () => {
        clearStatus();
        requestPreview();
      });

      const textWrap = document.createElement("span");
      const titleSpan = document.createElement("span");
      titleSpan.className = "radio-text";
      titleSpan.textContent = title;

      const codeSpan = document.createElement("span");
      codeSpan.className = "radio-code";
      codeSpan.textContent = "(" + id + ")";

      const descSpan = document.createElement("span");
      descSpan.className = "radio-desc";
      descSpan.textContent = " - " + desc;

      textWrap.appendChild(titleSpan);
      textWrap.appendChild(codeSpan);
      textWrap.appendChild(descSpan);
      label.appendChild(radio);
      label.appendChild(textWrap);
      typeListEl.appendChild(label);
    }
  }

  function applyLocale(tag) {
    currentLocaleKey = resolveLocaleKey(tag);
    const d = dict();
    document.documentElement.lang = d.htmlLang;
    document.title = d.dialogTitle;
    lblTypeEl.textContent = d.lblType;
    lblScopeEl.textContent = d.lblScope;
    lblSubjectEl.textContent = d.lblSubject;
    lblBodyEl.textContent = d.lblBody;
    lblWrap72El.textContent = d.lblWrap72;
    lblBreakingEl.textContent = d.lblBreaking;
    lblBreakingBangEl.innerHTML = d.lblBreakingBang;
    lblIssuesEl.textContent = d.lblIssues;
    lblSkipCiEl.textContent = d.lblSkipCi;
    lblPreviewEl.textContent = d.lblPreview;
    hintShortcutEl.textContent = d.hintShortcut;

    scopeInput.placeholder = d.phScope;
    subjectInput.placeholder = d.phSubject;
    bodyInput.placeholder = d.phBody;
    breakingInput.placeholder = d.phBreaking;
    issuesInput.placeholder = d.phIssues;

    reloadBtn.textContent = d.btnReload;
    reloadBtn.title = d.tipReload;
    resetBtn.textContent = d.btnReset;
    resetBtn.title = d.tipReset;
    okBtn.textContent = d.btnOk;
    cancelBtn.textContent = d.btnCancel;
    scopeToggle.title = d.tipScopeToggle;

    renderTypeRadios(getSelectedType());
    renderScopeMenu();
    renderPreview(lastPreviewState);
  }

  function getSelectedType() {
    const checked = typeListEl.querySelector('input[name="commitType"]:checked');
    return checked ? checked.value : "feat";
  }

  function setSelectedType(type) {
    const target = typeListEl.querySelector('input[name="commitType"][value="' + type + '"]');
    if (target) {
      target.checked = true;
    } else {
      const first = typeListEl.querySelector('input[name="commitType"]');
      if (first) first.checked = true;
    }
  }

  function normalizeIssueKeyword(kw) {
    const lower = String(kw || "Closes").toLowerCase();
    if (lower.startsWith("fix")) return "Fixes";
    if (lower.startsWith("resolve")) return "Resolves";
    return "Closes";
  }

  function readForm() {
    return {
      commitType: getSelectedType(),
      scope: scopeInput.value,
      subject: subjectInput.value,
      body: bodyInput.value,
      wrap72: wrap72Input.checked,
      breakingBang: breakingBangInput.checked,
      breaking: breakingInput.value,
      issues: issuesInput.value,
      issueKeyword: issueKeywordSelect.value || "Closes",
      skipCi: skipCiInput.checked
    };
  }

  function populateForm(form) {
    if (!form) return;
    setSelectedType(form.commitType || "feat");
    scopeInput.value = form.scope || "";
    subjectInput.value = form.subject || "";
    subjectInput.classList.remove("invalid");
    bodyInput.value = form.body || "";
    wrap72Input.checked = form.wrap72 !== false;
    breakingBangInput.checked = Boolean(form.breakingBang);
    breakingInput.value = form.breaking || "";
    issueKeywordSelect.value = normalizeIssueKeyword(form.issueKeyword);
    issuesInput.value = form.issues || "";
    skipCiInput.checked = Boolean(form.skipCi);
  }

  function renderPreview(preview) {
    if (!preview || typeof preview !== "object") return;
    lastPreviewState = preview;
    const d = dict();
    const msg = preview.message || "";
    const headerLen = typeof preview.headerLen === "number"
      ? preview.headerLen
      : Array.from((msg.split("\n")[0] || "")).length;
    const lineCount = typeof preview.lineCount === "number"
      ? preview.lineCount
      : msg.split("\n").length;

    previewText.textContent = msg;
    previewMeta.textContent = d.lines(lineCount);
    if (preview.headerWarn || headerLen > 72) {
      headerCount.textContent = d.charsWarn(headerLen);
      headerCount.className = "count-warn";
    } else {
      headerCount.textContent = d.chars(headerLen);
      headerCount.className = "";
    }
  }

  function buildStandalonePreview(form) {
    const bang = form.breakingBang ? "!" : "";
    const s = form.scope.trim();
    const header = (s ? `${form.commitType}(${s})${bang}: ` : `${form.commitType}${bang}: `) + form.subject.trim();
    const sections = [header];
    if (form.body.trim()) sections.push(form.body.trim());
    if (form.breaking.trim()) {
      const b = form.breaking.trim();
      sections.push(b.startsWith("BREAKING CHANGE:") ? b : "BREAKING CHANGE: " + b);
    }
    if (form.issues.trim()) {
      const items = form.issues.trim().split(/[,，\s]+/).filter(Boolean).map(x => /^\d+$/.test(x) ? "#" + x : x);
      if (items.length) sections.push(`${form.issueKeyword} ${items.join(", ")}`);
    }
    if (form.skipCi) sections.push("[skip ci]");
    const message = sections.join("\n\n");
    return {
      message,
      headerLen: Array.from(header).length,
      headerWarn: Array.from(header).length > 72,
      lineCount: message.split("\n").length
    };
  }

  function requestPreview() {
    const form = readForm();
    if (hasBridge) {
      send({ op: "preview", form });
    } else {
      renderPreview(buildStandalonePreview(form));
    }
  }

  function showError(text) {
    statusBanner.textContent = text;
    statusBanner.className = "status-banner show err";
  }

  function clearStatus() {
    statusBanner.className = "status-banner";
    statusBanner.textContent = "";
  }

  function renderScopeMenu() {
    const d = dict();
    scopeMenu.innerHTML = "";
    if (!recentScopes || recentScopes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = d.emptyScopes;
      scopeMenu.appendChild(empty);
      return;
    }
    for (const sc of recentScopes) {
      const row = document.createElement("div");
      row.className = "combo-option";
      const name = document.createElement("span");
      name.textContent = sc;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "combo-del";
      del.textContent = "×";
      del.title = d.tipRemoveScope;
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        send({ op: "remove-scope", scope: sc });
      });
      row.addEventListener("click", () => {
        scopeInput.value = sc;
        scopeMenu.classList.remove("open");
        requestPreview();
        subjectInput.focus();
      });
      row.appendChild(name);
      row.appendChild(del);
      scopeMenu.appendChild(row);
    }
  }

  function send(payload) {
    if (hasBridge) {
      window.openidea.postMessage(JSON.stringify(payload));
    }
  }

  function submitForm() {
    clearStatus();
    const form = readForm();
    if (!form.subject.trim()) {
      subjectInput.classList.add("invalid");
      subjectInput.focus();
      showError(dict().errEmptySubject);
      return;
    }
    subjectInput.classList.remove("invalid");
    send({ op: "apply", form });
  }

  function closeDialog() {
    if (window.openidea && window.openidea.dialog && typeof window.openidea.dialog.close === "function") {
      window.openidea.dialog.close();
    }
  }

  function cancelDialog() {
    clearStatus();
    closeDialog();
  }

  scopeToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    scopeMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("scopeCombo").contains(e.target)) {
      scopeMenu.classList.remove("open");
    }
  });

  for (const el of [scopeInput, subjectInput, bodyInput, breakingInput, issuesInput]) {
    el.addEventListener("input", () => {
      if (el === subjectInput && subjectInput.value.trim()) {
        subjectInput.classList.remove("invalid");
      }
      clearStatus();
      requestPreview();
    });
  }

  for (const el of [wrap72Input, breakingBangInput, issueKeywordSelect, skipCiInput]) {
    el.addEventListener("change", () => {
      clearStatus();
      requestPreview();
    });
  }

  okBtn.addEventListener("click", submitForm);
  cancelBtn.addEventListener("click", cancelDialog);

  reloadBtn.addEventListener("click", () => {
    clearStatus();
    send({ op: "reload" });
  });

  resetBtn.addEventListener("click", () => {
    clearStatus();
    populateForm({
      commitType: "feat",
      scope: "",
      subject: "",
      body: "",
      wrap72: true,
      breakingBang: false,
      breaking: "",
      issues: "",
      issueKeyword: "Closes",
      skipCi: false
    });
    requestPreview();
    subjectInput.focus();
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitForm();
      return;
    }
    if (e.key === "Escape" && scopeMenu.classList.contains("open")) {
      e.preventDefault();
      e.stopPropagation();
      scopeMenu.classList.remove("open");
    }
  });

  renderTypeRadios("feat");
  applyLocale(currentLocaleKey);

  // Standalone demo mode for documentation screenshots when opened outside OpenIDEA.
  if (!hasBridge && params.get("demo") === "1") {
    const demoSamples = {
      "en": {
        commitType: "feat",
        scope: "auth",
        subject: "support OAuth2 PKCE login flow",
        body: "Add PKCE verifier generation and token exchange retry handling.",
        issues: "#128",
        issueKeyword: "Closes",
        wrap72: true
      },
      "zh-CN": {
        commitType: "feat",
        scope: "auth",
        subject: "支持 OAuth2 PKCE 授权登录流程",
        body: "补充 PKCE 校验码生成与令牌刷新重试逻辑。",
        issues: "#128",
        issueKeyword: "Closes",
        wrap72: true
      },
      "zh-TW": {
        commitType: "feat",
        scope: "auth",
        subject: "支援 OAuth2 PKCE 授權登入流程",
        body: "補齊 PKCE 驗證碼產生與權杖重新整理重試邏輯。",
        issues: "#128",
        issueKeyword: "Closes",
        wrap72: true
      },
      "ja": {
        commitType: "feat",
        scope: "auth",
        subject: "OAuth2 PKCE ログインフローに対応",
        body: "PKCE 検証コードの生成とトークン更新時のリトライ処理を追加。",
        issues: "#128",
        issueKeyword: "Closes",
        wrap72: true
      },
      "ko": {
        commitType: "feat",
        scope: "auth",
        subject: "OAuth2 PKCE 로그인 흐름 지원",
        body: "PKCE 검증 코드 생성 및 토큰 갱신 재시도 로직 추가.",
        issues: "#128",
        issueKeyword: "Closes",
        wrap72: true
      }
    };
    populateForm(demoSamples[currentLocaleKey] || demoSamples["en"]);
    requestPreview();
  } else {
    populateForm({});
    requestPreview();
  }

  if (window.openidea && typeof window.openidea.onMessage === "function") {
    window.openidea.onMessage((raw) => {
      let msg;
      try {
        msg = typeof raw === "string" ? JSON.parse(raw) : raw;
      } catch {
        return;
      }
      if (!msg || typeof msg !== "object") return;
      if (msg.op === "init") {
        clearStatus();
        if (msg.locale) {
          applyLocale(msg.locale);
        }
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        if (msg.form) {
          populateForm(msg.form);
        }
        if (msg.preview) {
          renderPreview(msg.preview);
        } else {
          requestPreview();
        }
        subjectInput.focus();
      } else if (msg.op === "preview") {
        renderPreview(msg.preview);
      } else if (msg.op === "scopes") {
        recentScopes = Array.isArray(msg.scopes) ? msg.scopes : [];
        renderScopeMenu();
      } else if (msg.op === "applied") {
        closeDialog();
      } else if (msg.op === "error") {
        showError(msg.message || dict().errGeneric);
      }
    });
  }

  send({ op: "ready" });
})();
</script>
</body>
</html>
