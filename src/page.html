<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑提交消息</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--openidea-bg, #1e1f22);
    color: var(--openidea-fg, #bcbec4);
    font-family: var(--openidea-font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif);
    font-size: var(--openidea-font-size, 13px);
    line-height: 1.45;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
  }

  .form-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px 14px 10px;
  }

  .mode-tip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    margin-bottom: 12px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--openidea-fg-muted, #9da0a8);
    background: var(--openidea-bg-elevated, #25272a);
    border: 1px solid var(--openidea-border, #393b40);
  }

  .grid {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    column-gap: 10px;
    row-gap: 10px;
    align-items: start;
  }

  .row-label {
    color: var(--openidea-fg, #bcbec4);
    padding-top: 5px;
    user-select: none;
    white-space: nowrap;
  }

  .req-dot {
    color: var(--openidea-danger, #f75464);
    margin-left: 2px;
  }

  .type-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .type-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--openidea-border, #43454a);
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg, #bcbec4);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 0.1s ease, border-color 0.1s ease, color 0.1s ease;
  }

  .type-chip:hover {
    background: var(--openidea-bg-hover, #35373b);
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .type-chip.active {
    background: rgba(53, 116, 240, 0.18);
    border-color: var(--openidea-accent, #3574f0);
    color: var(--openidea-fg-strong, #ffffff);
  }

  .type-code {
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-weight: 600;
    color: var(--openidea-accent, #548af7);
  }

  .type-chip.active .type-code {
    color: var(--openidea-fg-strong, #ffffff);
  }

  .type-desc {
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--openidea-fg-muted, #868a91);
  }

  input[type="text"],
  textarea,
  select {
    width: 100%;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }

  input[type="text"]:focus,
  textarea:focus,
  select:focus {
    border-color: var(--openidea-accent, #3574f0);
    box-shadow: 0 0 0 1px var(--openidea-focus-ring, rgba(53, 116, 240, 0.45));
  }

  input[type="text"].invalid {
    border-color: var(--openidea-danger, #f75464);
  }

  textarea {
    resize: vertical;
    min-height: 64px;
  }

  .textarea-compact {
    min-height: 48px;
  }

  .combo {
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .combo input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-right: none;
  }

  .combo-btn {
    width: 28px;
    flex: 0 0 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-muted, #9da0a8);
    border: 1px solid var(--openidea-border, #43454a);
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .combo-btn:hover {
    background: var(--openidea-bg-hover, #35373b);
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-menu {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    max-height: 180px;
    overflow-y: auto;
    background: var(--openidea-bg-elevated, #2b2d30);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    z-index: 20;
    display: none;
  }

  .combo-menu.open {
    display: block;
  }

  .combo-empty {
    padding: 8px 10px;
    color: var(--openidea-fg-muted, #868a91);
    font-size: 12px;
  }

  .combo-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-option:hover {
    background: var(--openidea-bg-selected, #2e436e);
  }

  .combo-del {
    background: transparent;
    border: none;
    color: var(--openidea-fg-muted, #868a91);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }

  .combo-del:hover {
    color: var(--openidea-danger, #f75464);
    background: rgba(255, 255, 255, 0.06);
  }

  .issues-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .issues-row select {
    width: 96px;
    flex: 0 0 96px;
    padding: 5px 6px;
  }

  .check-stack {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .check-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    color: var(--openidea-fg-strong, #dfe1e5);
    font-size: 12.5px;
  }

  .check-row input[type="checkbox"] {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--openidea-accent, #3574f0);
    cursor: pointer;
  }

  .field-hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--openidea-fg-muted, #868a91);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .count-warn {
    color: var(--openidea-warning, #e5a54b);
    font-weight: 500;
  }

  .preview-box {
    margin-top: 12px;
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    background: var(--openidea-bg-elevated, #25272a);
    overflow: hidden;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--openidea-fg-muted, #9da0a8);
    border-bottom: 1px solid var(--openidea-border, #393b40);
    user-select: none;
  }

  .preview-content {
    margin: 0;
    padding: 8px 10px;
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--openidea-fg-strong, #dfe1e5);
    max-height: 136px;
    overflow-y: auto;
  }

  .status-banner {
    display: none;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
  }

  .status-banner.show {
    display: block;
  }

  .status-banner.ok {
    background: rgba(87, 150, 92, 0.16);
    color: var(--openidea-success, #6aab73);
    border: 1px solid rgba(87, 150, 92, 0.35);
  }

  .status-banner.err {
    background: rgba(247, 84, 100, 0.14);
    color: var(--openidea-danger, #f75464);
    border: 1px solid rgba(247, 84, 100, 0.35);
  }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 14px;
    border-top: 1px solid var(--openidea-border, #393b40);
    background: var(--openidea-bg, #1e1f22);
  }

  .footer-left,
  .footer-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    height: 28px;
    padding: 0 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: 1px solid var(--openidea-border, #4e5157);
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    transition: background-color 0.1s ease, border-color 0.1s ease;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--openidea-bg-hover, #383a40);
  }

  .btn-primary {
    background: var(--openidea-accent, #3574f0);
    border-color: var(--openidea-accent, #3574f0);
    color: var(--openidea-fg-on-accent, #ffffff);
    font-weight: 500;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
    background: var(--openidea-accent, #3574f0);
  }

  .btn-ghost {
    padding: 0 8px;
    border-color: transparent;
    background: transparent;
    color: var(--openidea-fg-muted, #9da0a8);
  }

  .btn-ghost:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.06));
    color: var(--openidea-fg-strong, #dfe1e5);
  }
</style>
</head>
<body>
<div class="app">
  <div class="form-scroll">
    <div class="mode-tip">
      <span>日常提交可直接点击 Commit 工具栏图标使用自动关闭的弹窗向导</span>
    </div>

    <div class="grid">
      <div class="row-label">提交类型</div>
      <div>
        <div class="type-chips" id="typeList" role="radiogroup" aria-label="提交类型"></div>
        <div class="type-desc" id="typeDesc"></div>
      </div>

      <label class="row-label" for="scopeInput">变更范围</label>
      <div class="combo" id="scopeCombo">
        <input id="scopeInput" type="text" placeholder="可选，如 auth、api、workflow" autocomplete="off" />
        <button type="button" class="combo-btn" id="scopeToggle" title="选择常用变更范围" aria-label="展开变更范围历史">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="combo-menu" id="scopeMenu"></div>
      </div>

      <label class="row-label" for="subjectInput">简短说明<span class="req-dot">*</span></label>
      <div>
        <input id="subjectInput" type="text" placeholder="必填：一句话概括本次变更" autocomplete="off" />
        <div class="field-hint">
          <span>按 Ctrl+Enter 快速填入提交框</span>
          <span id="headerCount">0 字符</span>
        </div>
      </div>

      <label class="row-label" for="bodyInput">详细说明</label>
      <div>
        <textarea id="bodyInput" placeholder="可选：详细描述改动背景、原因或实现要点"></textarea>
        <div style="margin-top: 6px;" class="check-stack">
          <label class="check-row">
            <input id="wrap72Input" type="checkbox" checked />
            <span>正文超过 72 字符自动换行</span>
          </label>
        </div>
      </div>

      <label class="row-label" for="breakingInput">重大变化</label>
      <div>
        <textarea id="breakingInput" class="textarea-compact" placeholder="可选：描述不兼容变更（自动添加 BREAKING CHANGE: 前缀）"></textarea>
        <div style="margin-top: 6px;" class="check-stack">
          <label class="check-row">
            <input id="breakingBangInput" type="checkbox" />
            <span>在标题添加 <code>!</code> 标记（如 <code>feat!:</code>）</span>
          </label>
        </div>
      </div>

      <label class="row-label" for="issuesInput">关联 Issues</label>
      <div class="issues-row">
        <select id="issueKeywordSelect" aria-label="Issue 关联关键字">
          <option value="Closes">Closes</option>
          <option value="Fixes">Fixes</option>
          <option value="Resolves">Resolves</option>
        </select>
        <input id="issuesInput" type="text" placeholder="可选：如 #123, #456 或 PROJ-88" autocomplete="off" />
      </div>

      <div></div>
      <div class="check-stack">
        <label class="check-row">
          <input id="skipCiInput" type="checkbox" />
          <span>跳过 CI 流程（附带 <code>[skip ci]</code>）</span>
        </label>
      </div>
    </div>

    <div class="preview-box">
      <div class="preview-header">
        <span>提交信息预览</span>
        <span id="previewMeta">1 行</span>
      </div>
      <pre class="preview-content" id="previewText"></pre>
    </div>

    <div class="status-banner" id="statusBanner"></div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <button type="button" class="btn btn-ghost" id="reloadBtn" title="从当前 Commit 输入框重新读取">读取当前</button>
      <button type="button" class="btn btn-ghost" id="resetBtn" title="清空所有字段">清空</button>
    </div>
    <div class="footer-right">
      <button type="button" class="btn" id="restoreBtn" title="恢复为上次读取时的内容">还原修改</button>
      <button type="button" class="btn btn-primary" id="okBtn">填入提交框</button>
    </div>
  </div>
</div>

<script>
(function () {
  const TYPES = [
    { id: "feat", short: "新功能", desc: "新增功能或特性" },
    { id: "fix", short: "修复Bug", desc: "修复线上或测试发现的错误" },
    { id: "docs", short: "文档", desc: "仅文档或注释变更" },
    { id: "style", short: "格式", desc: "不影响代码逻辑的格式调整（空格、缩进、分号等）" },
    { id: "refactor", short: "重构", desc: "既不修 Bug 也不加功能的代码结构优化" },
    { id: "perf", short: "性能", desc: "提升执行效率或资源占用的改动" },
    { id: "test", short: "测试", desc: "新增或修正单元测试、集成测试" },
    { id: "build", short: "构建", desc: "影响构建系统或外部依赖版本的更改" },
    { id: "ci", short: "CI", desc: "修改持续集成配置与流水线脚本" },
    { id: "chore", short: "其他", desc: "不涉及业务源码与测试的其他维护改动" },
    { id: "revert", short: "回滚", desc: "撤销并恢复之前的提交" }
  ];

  const INITIAL = "__START__";

  const typeListEl = document.getElementById("typeList");
  const typeDescEl = document.getElementById("typeDesc");
  const scopeInput = document.getElementById("scopeInput");
  const scopeToggle = document.getElementById("scopeToggle");
  const scopeMenu = document.getElementById("scopeMenu");
  const subjectInput = document.getElementById("subjectInput");
  const headerCount = document.getElementById("headerCount");
  const bodyInput = document.getElementById("bodyInput");
  const wrap72Input = document.getElementById("wrap72Input");
  const breakingBangInput = document.getElementById("breakingBangInput");
  const breakingInput = document.getElementById("breakingInput");
  const issueKeywordSelect = document.getElementById("issueKeywordSelect");
  const issuesInput = document.getElementById("issuesInput");
  const skipCiInput = document.getElementById("skipCiInput");
  const previewText = document.getElementById("previewText");
  const previewMeta = document.getElementById("previewMeta");
  const statusBanner = document.getElementById("statusBanner");
  const reloadBtn = document.getElementById("reloadBtn");
  const resetBtn = document.getElementById("resetBtn");
  const restoreBtn = document.getElementById("restoreBtn");
  const okBtn = document.getElementById("okBtn");

  const hasBridge = Boolean(window.openidea && typeof window.openidea.postMessage === "function");

  let selectedType = "feat";
  let recentScopes = [];
  let lastLoadedForm = null;

  function renderTypeChips() {
    typeListEl.innerHTML = "";
    for (const item of TYPES) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "type-chip";
      btn.dataset.type = item.id;

      const codeSpan = document.createElement("span");
      codeSpan.className = "type-code";
      codeSpan.textContent = item.id;

      const nameSpan = document.createElement("span");
      nameSpan.textContent = item.short;

      btn.appendChild(codeSpan);
      btn.appendChild(nameSpan);
      btn.addEventListener("click", () => {
        clearStatus();
        setSelectedType(item.id);
        requestPreview();
      });
      typeListEl.appendChild(btn);
    }
  }

  function setSelectedType(type) {
    const matched = TYPES.find((t) => t.id === type) || TYPES[0];
    selectedType = matched.id;
    for (const btn of typeListEl.querySelectorAll(".type-chip")) {
      const active = btn.dataset.type === selectedType;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-checked", active ? "true" : "false");
    }
    typeDescEl.textContent = matched.id + "：" + matched.desc;
  }

  function normalizeIssueKeyword(kw) {
    const lower = String(kw || "Closes").toLowerCase();
    if (lower.startsWith("fix")) return "Fixes";
    if (lower.startsWith("resolve")) return "Resolves";
    return "Closes";
  }

  function readForm() {
    return {
      commitType: selectedType,
      scope: scopeInput.value,
      subject: subjectInput.value,
      body: bodyInput.value,
      wrap72: wrap72Input.checked,
      breakingBang: breakingBangInput.checked,
      breaking: breakingInput.value,
      issues: issuesInput.value,
      issueKeyword: issueKeywordSelect.value || "Closes",
      skipCi: skipCiInput.checked
    };
  }

  function populateForm(form, saveSnapshot) {
    if (!form) return;
    if (saveSnapshot) {
      lastLoadedForm = Object.assign({}, form);
    }
    setSelectedType(form.commitType || "feat");
    scopeInput.value = form.scope || "";
    subjectInput.value = form.subject || "";
    subjectInput.classList.remove("invalid");
    bodyInput.value = form.body || "";
    wrap72Input.checked = form.wrap72 !== false;
    breakingBangInput.checked = Boolean(form.breakingBang);
    breakingInput.value = form.breaking || "";
    issueKeywordSelect.value = normalizeIssueKeyword(form.issueKeyword);
    issuesInput.value = form.issues || "";
    skipCiInput.checked = Boolean(form.skipCi);
  }

  function renderPreview(preview) {
    if (!preview || typeof preview !== "object") return;
    const msg = preview.message || "";
    const headerLen = typeof preview.headerLen === "number"
      ? preview.headerLen
      : Array.from((msg.split("\n")[0] || "")).length;
    const lineCount = typeof preview.lineCount === "number"
      ? preview.lineCount
      : msg.split("\n").length;

    previewText.textContent = msg;
    previewMeta.textContent = lineCount + " 行";
    if (preview.headerWarn || headerLen > 72) {
      headerCount.textContent = headerLen + " 字符 · 建议精简至 72 内";
      headerCount.className = "count-warn";
    } else {
      headerCount.textContent = headerLen + " 字符";
      headerCount.className = "";
    }
  }

  function requestPreview() {
    const form = readForm();
    if (hasBridge) {
      send({ op: "preview", form });
    } else {
      const bang = form.breakingBang ? "!" : "";
      const s = form.scope.trim();
      const header = (s ? `${form.commitType}(${s})${bang}: ` : `${form.commitType}${bang}: `) + form.subject.trim();
      renderPreview({
        message: header,
        headerLen: Array.from(header).length,
        headerWarn: Array.from(header).length > 72,
        lineCount: 1
      });
    }
  }

  function showStatus(kind, text) {
    statusBanner.textContent = text;
    statusBanner.className = "status-banner show " + kind;
  }

  function clearStatus() {
    statusBanner.className = "status-banner";
    statusBanner.textContent = "";
  }

  function renderScopeMenu() {
    scopeMenu.innerHTML = "";
    if (!recentScopes || recentScopes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = "暂无常用变更范围，直接输入并填入后会自动记忆";
      scopeMenu.appendChild(empty);
      return;
    }
    for (const sc of recentScopes) {
      const row = document.createElement("div");
      row.className = "combo-option";
      const name = document.createElement("span");
      name.textContent = sc;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "combo-del";
      del.textContent = "×";
      del.title = "移除此记录";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        send({ op: "remove-scope", scope: sc });
      });
      row.addEventListener("click", () => {
        scopeInput.value = sc;
        scopeMenu.classList.remove("open");
        requestPreview();
        subjectInput.focus();
      });
      row.appendChild(name);
      row.appendChild(del);
      scopeMenu.appendChild(row);
    }
  }

  function send(payload) {
    if (hasBridge) {
      window.openidea.postMessage(JSON.stringify(payload));
    }
  }

  function submitForm() {
    clearStatus();
    const form = readForm();
    if (!form.subject.trim()) {
      subjectInput.classList.add("invalid");
      subjectInput.focus();
      showStatus("err", "请先填写简短说明（提交标题不能为空）。");
      return;
    }
    subjectInput.classList.remove("invalid");
    send({ op: "apply", form });
  }

  scopeToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    scopeMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("scopeCombo").contains(e.target)) {
      scopeMenu.classList.remove("open");
    }
  });

  for (const el of [scopeInput, subjectInput, bodyInput, breakingInput, issuesInput]) {
    el.addEventListener("input", () => {
      if (el === subjectInput && subjectInput.value.trim()) {
        subjectInput.classList.remove("invalid");
      }
      clearStatus();
      requestPreview();
    });
  }

  for (const el of [wrap72Input, breakingBangInput, issueKeywordSelect, skipCiInput]) {
    el.addEventListener("change", () => {
      clearStatus();
      requestPreview();
    });
  }

  okBtn.addEventListener("click", submitForm);

  restoreBtn.addEventListener("click", () => {
    clearStatus();
    if (lastLoadedForm) {
      populateForm(lastLoadedForm, false);
      requestPreview();
      showStatus("ok", "已还原为上次读取时的内容，未改动 Git 提交框。");
    }
  });

  resetBtn.addEventListener("click", () => {
    clearStatus();
    populateForm({
      commitType: "feat",
      scope: "",
      subject: "",
      body: "",
      wrap72: true,
      breakingBang: false,
      breaking: "",
      issues: "",
      issueKeyword: "Closes",
      skipCi: false
    }, false);
    requestPreview();
    subjectInput.focus();
  });

  reloadBtn.addEventListener("click", () => {
    clearStatus();
    send({ op: "reload" });
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitForm();
      return;
    }
    if (e.key === "Escape" && scopeMenu.classList.contains("open")) {
      e.preventDefault();
      e.stopPropagation();
      scopeMenu.classList.remove("open");
    }
  });

  renderTypeChips();

  if (INITIAL && typeof INITIAL === "object") {
    recentScopes = Array.isArray(INITIAL.scopes) ? INITIAL.scopes : [];
    renderScopeMenu();
    populateForm(INITIAL.form || {}, true);
    if (INITIAL.preview) {
      renderPreview(INITIAL.preview);
    } else {
      requestPreview();
    }
  } else {
    renderScopeMenu();
    populateForm({}, true);
    requestPreview();
    send({ op: "ready" });
  }

  if (window.openidea && typeof window.openidea.onMessage === "function") {
    window.openidea.onMessage((raw) => {
      let msg;
      try {
        msg = typeof raw === "string" ? JSON.parse(raw) : raw;
      } catch {
        return;
      }
      if (!msg || typeof msg !== "object") return;
      if (msg.op === "init") {
        clearStatus();
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        if (msg.form) {
          populateForm(msg.form, true);
        }
        if (msg.preview) {
          renderPreview(msg.preview);
        } else {
          requestPreview();
        }
        subjectInput.focus();
      } else if (msg.op === "preview") {
        renderPreview(msg.preview);
      } else if (msg.op === "scopes") {
        recentScopes = Array.isArray(msg.scopes) ? msg.scopes : [];
        renderScopeMenu();
      } else if (msg.op === "applied") {
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        if (msg.form) {
          populateForm(msg.form, true);
        } else {
          lastLoadedForm = readForm();
        }
        if (msg.preview) {
          renderPreview(msg.preview);
        }
        showStatus("ok", "已填入 Git 提交消息输入框。");
      } else if (msg.op === "error") {
        showStatus("err", msg.message || "操作失败，请确认当前项目已打开 Git 仓库。");
      }
    });
  }
})();
</script>
</body>
</html>
