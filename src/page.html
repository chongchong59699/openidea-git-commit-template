<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编辑提交消息</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--openidea-bg, #1e1f22);
    color: var(--openidea-fg, #bcbec4);
    font-family: var(--openidea-font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif);
    font-size: var(--openidea-font-size, 13px);
    line-height: 1.45;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100vh;
  }

  .form-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    column-gap: 12px;
    row-gap: 12px;
    align-items: start;
  }

  .row-label {
    color: var(--openidea-fg, #bcbec4);
    padding-top: 5px;
    user-select: none;
    white-space: nowrap;
  }

  .row-label.radio-label {
    padding-top: 2px;
    align-self: center;
  }

  .radio-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .radio-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background-color 0.1s ease;
  }

  .radio-item:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.05));
  }

  .radio-item input[type="radio"] {
    margin: 2px 0 0 0;
    accent-color: var(--openidea-accent, #3574f0);
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    cursor: pointer;
  }

  .radio-text {
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .radio-desc {
    color: var(--openidea-fg-muted, #868a91);
  }

  input[type="text"],
  textarea {
    width: 100%;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: inherit;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }

  input[type="text"]:focus,
  textarea:focus {
    border-color: var(--openidea-accent, #3574f0);
    box-shadow: 0 0 0 1px var(--openidea-focus-ring, rgba(53, 116, 240, 0.45));
  }

  textarea {
    resize: vertical;
    min-height: 68px;
  }

  .textarea-compact {
    min-height: 52px;
  }

  .combo {
    position: relative;
    display: flex;
    align-items: stretch;
  }

  .combo input[type="text"] {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    border-right: none;
  }

  .combo-btn {
    width: 28px;
    flex: 0 0 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-muted, #9da0a8);
    border: 1px solid var(--openidea-border, #43454a);
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .combo-btn:hover {
    background: var(--openidea-bg-hover, #35373b);
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-menu {
    position: absolute;
    top: calc(100% + 2px);
    left: 0;
    right: 0;
    max-height: 180px;
    overflow-y: auto;
    background: var(--openidea-bg-elevated, #2b2d30);
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    z-index: 20;
    display: none;
  }

  .combo-menu.open {
    display: block;
  }

  .combo-empty {
    padding: 8px 10px;
    color: var(--openidea-fg-muted, #868a91);
    font-size: 12px;
  }

  .combo-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .combo-option:hover {
    background: var(--openidea-bg-selected, #2e436e);
  }

  .combo-del {
    background: transparent;
    border: none;
    color: var(--openidea-fg-muted, #868a91);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }

  .combo-del:hover {
    color: var(--openidea-danger, #f75464);
    background: rgba(255, 255, 255, 0.06);
  }

  .check-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--openidea-fg-strong, #dfe1e5);
  }

  .check-row input[type="checkbox"] {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--openidea-accent, #3574f0);
    cursor: pointer;
  }

  .field-hint {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--openidea-fg-muted, #868a91);
    display: flex;
    justify-content: space-between;
  }

  .preview-box {
    margin-top: 14px;
    border: 1px solid var(--openidea-border, #43454a);
    border-radius: 4px;
    background: var(--openidea-bg-elevated, #25272a);
    overflow: hidden;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--openidea-fg-muted, #9da0a8);
    border-bottom: 1px solid var(--openidea-border, #393b40);
    user-select: none;
  }

  .preview-content {
    margin: 0;
    padding: 8px 10px;
    font-family: var(--openidea-font-mono, "JetBrains Mono", Consolas, monospace);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--openidea-fg-strong, #dfe1e5);
    max-height: 140px;
    overflow-y: auto;
  }

  .status-banner {
    display: none;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
  }

  .status-banner.show {
    display: block;
  }

  .status-banner.ok {
    background: rgba(87, 150, 92, 0.16);
    color: var(--openidea-success, #6aab73);
    border: 1px solid rgba(87, 150, 92, 0.35);
  }

  .status-banner.err {
    background: rgba(247, 84, 100, 0.14);
    color: var(--openidea-danger, #f75464);
    border: 1px solid rgba(247, 84, 100, 0.35);
  }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--openidea-border, #393b40);
    background: var(--openidea-bg, #1e1f22);
  }

  .footer-left,
  .footer-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    min-width: 68px;
    height: 28px;
    padding: 0 14px;
    border-radius: 4px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    border: 1px solid var(--openidea-border, #4e5157);
    background: var(--openidea-bg-input, #2b2d30);
    color: var(--openidea-fg-strong, #dfe1e5);
    transition: background-color 0.1s ease, border-color 0.1s ease;
  }

  .btn:hover {
    background: var(--openidea-bg-hover, #383a40);
  }

  .btn-primary {
    background: var(--openidea-accent, #3574f0);
    border-color: var(--openidea-accent, #3574f0);
    color: var(--openidea-fg-on-accent, #ffffff);
    font-weight: 500;
  }

  .btn-primary:hover {
    filter: brightness(1.08);
    background: var(--openidea-accent, #3574f0);
  }

  .btn-ghost {
    min-width: auto;
    padding: 0 10px;
    border-color: transparent;
    background: transparent;
    color: var(--openidea-fg-muted, #9da0a8);
  }

  .btn-ghost:hover {
    background: var(--openidea-bg-hover, rgba(255, 255, 255, 0.06));
    color: var(--openidea-fg-strong, #dfe1e5);
  }
</style>
</head>
<body>
<div class="app">
  <div class="form-scroll">
    <div class="grid">
      <div class="row-label radio-label">提交类型</div>
      <div class="radio-list" id="typeList"></div>

      <label class="row-label" for="scopeInput">变更范围</label>
      <div class="combo" id="scopeCombo">
        <input id="scopeInput" type="text" placeholder="可选，如 auth、api、workflow" autocomplete="off" />
        <button type="button" class="combo-btn" id="scopeToggle" title="选择常用变更范围" aria-label="展开变更范围历史">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="combo-menu" id="scopeMenu"></div>
      </div>

      <label class="row-label" for="subjectInput">简短说明</label>
      <div>
        <input id="subjectInput" type="text" placeholder="一句话概括本次变更" autocomplete="off" />
        <div class="field-hint">
          <span>按 Ctrl+Enter 快速填入</span>
          <span id="headerCount">0 字符</span>
        </div>
      </div>

      <label class="row-label" for="bodyInput">详细说明</label>
      <textarea id="bodyInput" placeholder="可选：详细描述改动背景、原因或实现要点"></textarea>

      <div></div>
      <label class="check-row">
        <input id="wrap72Input" type="checkbox" checked />
        <span>超过 72 字符换行?</span>
      </label>

      <label class="row-label" for="breakingInput">重大变化</label>
      <textarea id="breakingInput" class="textarea-compact" placeholder="可选：描述不兼容变更（自动添加 BREAKING CHANGE: 前缀）"></textarea>

      <label class="row-label" for="issuesInput">关闭 issues</label>
      <input id="issuesInput" type="text" placeholder="可选：如 #123, #456（自动添加 Closes 前缀）" autocomplete="off" />

      <div></div>
      <label class="check-row">
        <input id="skipCiInput" type="checkbox" />
        <span>跳过 CI 流程?</span>
      </label>
    </div>

    <div class="preview-box">
      <div class="preview-header">
        <span>提交信息预览</span>
        <span id="previewMeta"></span>
      </div>
      <pre class="preview-content" id="previewText"></pre>
    </div>

    <div class="status-banner" id="statusBanner"></div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <button type="button" class="btn btn-ghost" id="reloadBtn" title="从当前 Commit 输入框重新读取">读取当前</button>
      <button type="button" class="btn btn-ghost" id="resetBtn" title="清空表单">重置</button>
    </div>
    <div class="footer-right">
      <button type="button" class="btn btn-primary" id="okBtn">好的</button>
      <button type="button" class="btn" id="cancelBtn">取消</button>
    </div>
  </div>
</div>

<script>
(function () {
  const TYPES = [
    { id: "feat", title: "新功能、新特性", desc: "一个新功能" },
    { id: "fix", title: "修复 Bug", desc: "错误修复" },
    { id: "docs", title: "编辑文档", desc: "仅文档更改" },
    { id: "style", title: "代码格式修改", desc: "不影响代码含义的更改（例如：空格、格式、缺少分号）" },
    { id: "refactor", title: "代码重构", desc: "既不修复错误也不添加功能的代码更改" },
    { id: "perf", title: "代码优化", desc: "提高性能的代码更改" },
    { id: "test", title: "测试用例新增/修改", desc: "添加缺失的测试或纠正现有测试" },
    { id: "build", title: "修改项目构建/依赖", desc: "影响构建系统或外部依赖项的更改（例如：gulp、broccoli、npm）" },
    { id: "ci", title: "修改持续集成配置", desc: "对 CI 配置文件和脚本的更改（例如：Travis、Circle、BrowserStack、SauceLabs）" },
    { id: "chore", title: "其他修改", desc: "其他不修改 src 或测试文件的更改" },
    { id: "revert", title: "恢复上一次提交", desc: "恢复之前的提交" }
  ];

  const INITIAL = "__START__";

  const typeListEl = document.getElementById("typeList");
  const scopeInput = document.getElementById("scopeInput");
  const scopeToggle = document.getElementById("scopeToggle");
  const scopeMenu = document.getElementById("scopeMenu");
  const subjectInput = document.getElementById("subjectInput");
  const headerCount = document.getElementById("headerCount");
  const bodyInput = document.getElementById("bodyInput");
  const wrap72Input = document.getElementById("wrap72Input");
  const breakingInput = document.getElementById("breakingInput");
  const issuesInput = document.getElementById("issuesInput");
  const skipCiInput = document.getElementById("skipCiInput");
  const previewText = document.getElementById("previewText");
  const previewMeta = document.getElementById("previewMeta");
  const statusBanner = document.getElementById("statusBanner");
  const reloadBtn = document.getElementById("reloadBtn");
  const resetBtn = document.getElementById("resetBtn");
  const okBtn = document.getElementById("okBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  let recentScopes = [];
  let lastLoadedForm = null;

  function renderTypeRadios() {
    typeListEl.innerHTML = "";
    for (const item of TYPES) {
      const label = document.createElement("label");
      label.className = "radio-item";
      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "commitType";
      radio.value = item.id;
      radio.addEventListener("change", updatePreview);

      const textWrap = document.createElement("span");
      const titleSpan = document.createElement("span");
      titleSpan.className = "radio-text";
      titleSpan.textContent = item.title;
      const descSpan = document.createElement("span");
      descSpan.className = "radio-desc";
      descSpan.textContent = " - " + item.desc;

      textWrap.appendChild(titleSpan);
      textWrap.appendChild(descSpan);
      label.appendChild(radio);
      label.appendChild(textWrap);
      typeListEl.appendChild(label);
    }
  }

  function getSelectedType() {
    const checked = typeListEl.querySelector('input[name="commitType"]:checked');
    return checked ? checked.value : "feat";
  }

  function setSelectedType(type) {
    const target = typeListEl.querySelector('input[name="commitType"][value="' + type + '"]');
    if (target) {
      target.checked = true;
    } else {
      const first = typeListEl.querySelector('input[name="commitType"]');
      if (first) first.checked = true;
    }
  }

  function readForm() {
    return {
      commitType: getSelectedType(),
      scope: scopeInput.value,
      subject: subjectInput.value,
      body: bodyInput.value,
      wrap72: wrap72Input.checked,
      breaking: breakingInput.value,
      issues: issuesInput.value,
      skipCi: skipCiInput.checked
    };
  }

  function applyForm(form) {
    if (!form) return;
    lastLoadedForm = Object.assign({}, form);
    setSelectedType(form.commitType || "feat");
    scopeInput.value = form.scope || "";
    subjectInput.value = form.subject || "";
    bodyInput.value = form.body || "";
    wrap72Input.checked = form.wrap72 !== false;
    breakingInput.value = form.breaking || "";
    issuesInput.value = form.issues || "";
    skipCiInput.checked = Boolean(form.skipCi);
    updatePreview();
  }

  function wrapLine(line, maxChars) {
    const chars = Array.from(line);
    if (chars.length <= maxChars) return line;
    const out = [];
    let remaining = line;
    while (Array.from(remaining).length > maxChars) {
      const slice = Array.from(remaining).slice(0, maxChars).join("");
      const lastSpace = slice.search(/\s[^\s]*$/);
      if (lastSpace > 0) {
        out.push(slice.slice(0, lastSpace).trimEnd());
        remaining = remaining.slice(lastSpace).trimStart();
      } else {
        out.push(slice);
        remaining = Array.from(remaining).slice(maxChars).join("");
      }
    }
    if (remaining.length > 0) out.push(remaining);
    return out.join("\n");
  }

  function wrapMultiline(text, maxChars) {
    return text.replace(/\r\n?/g, "\n").split("\n").map(l => wrapLine(l, maxChars)).join("\n");
  }

  function formatIssues(raw) {
    const lower = raw.toLowerCase();
    for (const kw of ["closes ", "close ", "fixes ", "fix ", "resolves ", "resolve "]) {
      if (lower.startsWith(kw)) return raw;
    }
    const items = raw
      .split(/[,，\s]+/)
      .map(s => s.trim())
      .filter(Boolean)
      .map(s => (/^\d+$/.test(s) ? "#" + s : s));
    return items.length ? "Closes " + items.join(", ") : "";
  }

  function formatPreview(form) {
    const t = (form.commitType || "feat").trim();
    const s = (form.scope || "").trim();
    const subj = (form.subject || "").trim();
    const header = s ? `${t}(${s}): ${subj}` : `${t}: ${subj}`;
    const sections = [header];

    const body = (form.body || "").trim();
    if (body) {
      sections.push(form.wrap72 ? wrapMultiline(body, 72) : body.replace(/\r\n?/g, "\n"));
    }

    const breaking = (form.breaking || "").trim();
    if (breaking) {
      const prefixed = breaking.startsWith("BREAKING CHANGE:")
        ? breaking
        : "BREAKING CHANGE: " + breaking;
      sections.push(form.wrap72 ? wrapMultiline(prefixed, 72) : prefixed.replace(/\r\n?/g, "\n"));
    }

    const issues = (form.issues || "").trim();
    if (issues) {
      const formatted = formatIssues(issues);
      if (formatted) sections.push(formatted);
    }

    if (form.skipCi) {
      sections.push("[skip ci]");
    }

    return sections.join("\n\n");
  }

  function updatePreview() {
    const form = readForm();
    const msg = formatPreview(form);
    const firstLine = msg.split("\n")[0] || "";
    const firstLen = Array.from(firstLine).length;
    headerCount.textContent = firstLen + " 字符";
    previewText.textContent = msg;
    previewMeta.textContent = msg.split("\n").length + " 行";
  }

  function showStatus(kind, text) {
    statusBanner.textContent = text;
    statusBanner.className = "status-banner show " + kind;
  }

  function clearStatus() {
    statusBanner.className = "status-banner";
    statusBanner.textContent = "";
  }

  function renderScopeMenu() {
    scopeMenu.innerHTML = "";
    if (!recentScopes || recentScopes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "combo-empty";
      empty.textContent = "暂无常用变更范围，直接输入即可自动记忆";
      scopeMenu.appendChild(empty);
      return;
    }
    for (const sc of recentScopes) {
      const row = document.createElement("div");
      row.className = "combo-option";
      const name = document.createElement("span");
      name.textContent = sc;
      const del = document.createElement("button");
      del.type = "button";
      del.className = "combo-del";
      del.textContent = "×";
      del.title = "移除此记录";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        send({ op: "remove-scope", scope: sc });
      });
      row.addEventListener("click", () => {
        scopeInput.value = sc;
        scopeMenu.classList.remove("open");
        updatePreview();
        subjectInput.focus();
      });
      row.appendChild(name);
      row.appendChild(del);
      scopeMenu.appendChild(row);
    }
  }

  function send(payload) {
    if (window.openidea && typeof window.openidea.postMessage === "function") {
      window.openidea.postMessage(JSON.stringify(payload));
    }
  }

  function submitForm() {
    clearStatus();
    const form = readForm();
    if (!form.subject.trim()) {
      showStatus("err", "请填写「简短说明」后再确认。");
      subjectInput.focus();
      return;
    }
    send({ op: "apply", form });
  }

  scopeToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    scopeMenu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!document.getElementById("scopeCombo").contains(e.target)) {
      scopeMenu.classList.remove("open");
    }
  });

  for (const el of [scopeInput, subjectInput, bodyInput, breakingInput, issuesInput]) {
    el.addEventListener("input", () => {
      clearStatus();
      updatePreview();
    });
  }

  for (const el of [wrap72Input, skipCiInput]) {
    el.addEventListener("change", updatePreview);
  }

  okBtn.addEventListener("click", submitForm);

  cancelBtn.addEventListener("click", () => {
    clearStatus();
    if (lastLoadedForm) {
      applyForm(lastLoadedForm);
    }
    showStatus("ok", "已恢复为读取时的内容，未修改提交框。");
  });

  resetBtn.addEventListener("click", () => {
    clearStatus();
    applyForm({
      commitType: "feat",
      scope: "",
      subject: "",
      body: "",
      wrap72: true,
      breaking: "",
      issues: "",
      skipCi: false
    });
    subjectInput.focus();
  });

  reloadBtn.addEventListener("click", () => {
    clearStatus();
    send({ op: "reload" });
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitForm();
    }
  });

  renderTypeRadios();

  if (INITIAL && typeof INITIAL === "object") {
    recentScopes = Array.isArray(INITIAL.scopes) ? INITIAL.scopes : [];
    renderScopeMenu();
    applyForm(INITIAL.form || {});
  } else {
    renderScopeMenu();
    applyForm({});
  }

  if (window.openidea && typeof window.openidea.onMessage === "function") {
    window.openidea.onMessage((raw) => {
      let msg;
      try {
        msg = typeof raw === "string" ? JSON.parse(raw) : raw;
      } catch {
        return;
      }
      if (!msg || typeof msg !== "object") return;
      if (msg.op === "init") {
        clearStatus();
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        if (msg.form) {
          applyForm(msg.form);
        }
        subjectInput.focus();
      } else if (msg.op === "scopes") {
        recentScopes = Array.isArray(msg.scopes) ? msg.scopes : [];
        renderScopeMenu();
      } else if (msg.op === "applied") {
        if (Array.isArray(msg.scopes)) {
          recentScopes = msg.scopes;
          renderScopeMenu();
        }
        showStatus("ok", "已成功填充到 Git 提交消息输入框。");
      } else if (msg.op === "error") {
        showStatus("err", msg.message || "操作失败，请确认当前项目已打开 Git 仓库。");
      }
    });
  }

  send({ op: "ready" });
})();
</script>
</body>
</html>
